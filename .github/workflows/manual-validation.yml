name: Manual Validation

# GitHub runs nothing automatically. Validation is local-first through
# scripts/run_tests.sh (see docs/ci-validation.md); this workflow only lets a
# maintainer run the same script on a clean hosted machine on demand. Every
# exact pass line lives in the pin table at the top of scripts/run_tests.sh.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "run_tests.sh tier: quick or full"
        type: choice
        options:
          - quick
          - full
        default: quick

permissions:
  contents: read

concurrency:
  group: manual-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: run_tests.sh (${{ inputs.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      PYTHONDONTWRITEBYTECODE: "1"
      TIER: ${{ inputs.tier }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the full tier's diff-check step can find origin/master.
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check fastapi httpx

      - name: Install engine dependencies
        run: npm ci

      - name: Run local validation script
        run: |
          set -euo pipefail
          args=(--no-infra)
          if [ "$TIER" = quick ]; then
            args+=(--quick)
          fi
          TMPDIR="$RUNNER_TEMP" scripts/run_tests.sh "${args[@]}"

      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-logs-${{ inputs.tier }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/run_tests.*/
          if-no-files-found: warn
          retention-days: 14
