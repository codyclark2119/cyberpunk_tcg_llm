name: PR Validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit, static, and build validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate cards
        run: npm run validate:cards

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

  integration:
    name: Database integration validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyberpunk_tcg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cyberpunk_tcg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cyberpunk_tcg
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests with zero skips
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test --test-concurrency=1 --test-reporter=tap tests/integration/*.test.ts | tee integration.tap
          grep -Eq '^# tests [1-9][0-9]*$' integration.tap
          grep -q '^# fail 0$' integration.tap
          grep -q '^# skipped 0$' integration.tap
