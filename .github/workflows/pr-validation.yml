name: PR Validation

# Full acceptance is intentionally independent of changed paths, including docs.
# No source/helper/schema change can hide behind a generated-fixture classifier.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Unit, static, and build validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Test CI execution guards
        run: node --test .github/scripts/*.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate cards
        run: npm run validate:cards

      - name: Full unit suite with execution evidence
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/pr-validation-unit.tap"
          node .github/scripts/assert-test-summary.mjs "$RUNNER_TEMP/pr-validation-unit.tap"

      - name: Build
        run: npm run build

      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"

      - name: Preserve unit execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-validation-unit.tap
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Database integration validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyberpunk_tcg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cyberpunk_tcg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cyberpunk_tcg
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests with zero skips
        run: |
          set -euo pipefail
          : "${TEST_DATABASE_URL:?TEST_DATABASE_URL must be set}"
          : "${TEST_MONGODB_URI:?TEST_MONGODB_URI must be set}"
          npm run test:integration 2>&1 | tee "$RUNNER_TEMP/pr-validation-integration.tap"
          node .github/scripts/assert-test-summary.mjs "$RUNNER_TEMP/pr-validation-integration.tap" --minimum-tests 12

      - name: Preserve integration execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-tap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-validation-integration.tap
          if-no-files-found: warn
          retention-days: 14


  ai:
    name: AI harness validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Python CI dependencies
        run: python -m pip install --disable-pip-version-check fastapi httpx

      - name: Install engine dependencies
        run: npm ci

      - name: Compile Python sources
        run: python -m compileall -q games harness scripts

      - name: Test Cyberpunk corpus and ingestion
        run: |
          set -euo pipefail
          python scripts/test_cyberpunk.py 2>&1 | tee "$RUNNER_TEMP/ai-cyberpunk.log"
          grep -q '^all 89 tests passed$' "$RUNNER_TEMP/ai-cyberpunk.log"

      - name: Test generic harness core
        run: |
          set -euo pipefail
          python scripts/test_harness_core.py 2>&1 | tee "$RUNNER_TEMP/ai-harness-core.log"
          grep -q '^48 tests passed$' "$RUNNER_TEMP/ai-harness-core.log"

      - name: Test engine candidate bridge
        run: |
          set -euo pipefail
          python scripts/test_engine_candidates.py 2>&1 | tee "$RUNNER_TEMP/ai-engine-candidates.log"
          grep -q '^PASS 3/3$' "$RUNNER_TEMP/ai-engine-candidates.log"

      - name: Test external simulator bot contract
        run: |
          set -euo pipefail
          python scripts/test_sim_bot.py 2>&1 | tee "$RUNNER_TEMP/ai-sim-bot.log"
          grep -q '^PASS simulator bot: 29/29$' "$RUNNER_TEMP/ai-sim-bot.log"

      - name: Validate community deck rules and negative controls
        run: |
          set -euo pipefail
          python scripts/check_deck_rules.py --negative-control 2>&1 | tee "$RUNNER_TEMP/ai-deck-rules.log"
          grep -q 'agree:    272/272' "$RUNNER_TEMP/ai-deck-rules.log"
          grep -q 'reproduce budget AND usage exactly: 272/272' "$RUNNER_TEMP/ai-deck-rules.log"
          if grep -q '<-- LOOK' "$RUNNER_TEMP/ai-deck-rules.log"; then
            echo "A deck-rule negative control did not fire through its intended rule." >&2
            exit 1
          fi

      - name: Test Python to authoritative engine boundary
        run: |
          set -euo pipefail
          python scripts/test_engine_adapter.py --app-root . 2>&1 | tee "$RUNNER_TEMP/ai-engine-adapter.log"

      - name: Preserve AI validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ai-cyberpunk.log
            ${{ runner.temp }}/ai-harness-core.log
            ${{ runner.temp }}/ai-engine-candidates.log
            ${{ runner.temp }}/ai-deck-rules.log
            ${{ runner.temp }}/ai-engine-adapter.log
            ${{ runner.temp }}/ai-sim-bot.log
          if-no-files-found: warn
          retention-days: 14
