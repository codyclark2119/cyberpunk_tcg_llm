name: Complete API Admission Batch V6

on:
  push:
    branches:
      - review/api-admission-batch-v6-foundation

permissions:
  contents: write
  actions: write

concurrency:
  group: v6-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete:
    name: Regenerate V6 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BRANCH: review/api-admission-batch-v6-foundation
      BASELINE_SHA: 1aaba357f46e83296419c1871fac3c28ea70dcff
      DEMO_MATRIX_CONCURRENCY: "4"
    steps:
      - name: Checkout V6 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test completion workflow guards
        run: node --test .github/scripts/api-admission-batch-v6-complete.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Regenerate and verify V6 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/api-admission-batch-v6-complete.sh

      - name: Preserve generated baseline on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v6-baseline-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/fixtures
            packages/wire/schemas
            docs/api-admission-batch-v6-verification.md
          if-no-files-found: warn
          retention-days: 7
