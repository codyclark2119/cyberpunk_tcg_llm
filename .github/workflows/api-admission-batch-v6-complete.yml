name: Complete API Admission Batch V6

on:
  push:
    branches:
      - review/api-admission-batch-v6-foundation

permissions:
  contents: write

jobs:
  complete:
    name: Regenerate V6 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BRANCH: review/api-admission-batch-v6-foundation
      BASELINE_SHA: 1aaba357f46e83296419c1871fac3c28ea70dcff
      DEMO_MATRIX_CONCURRENCY: "4"
    steps:
      - name: Checkout V6 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate and verify V6 baseline
        shell: bash
        run: bash .github/scripts/api-admission-batch-v6-complete.sh
