# mlx_lm.lora config for the rules-only true/false adapter (plan: LoRA on rules-based true/false).
# Keys checked against mlx-lm 0.31.3's lora.py (CONFIG_DEFAULTS and its argparse options); a key given on
# the command line wins over this file. Not yet run.
#
#   mlx_lm.lora --config configs/lora-rules-tf-v1.yaml
#
# Data: scripts/build_tf_dataset.py -> data/datasets/rules-tf-v1 ({"messages", "tools"} rows, which
# ChatDataset renders through the model's own chat template, tools included). mask_prompt puts the loss on
# the final assistant message only (the target), never on the system prompt, preload or question.
model: models/qwen3-8b-4bit
train: true
data: data/datasets/rules-tf-v1
fine_tune_type: lora
mask_prompt: true
num_layers: 16
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 20.0
learning_rate: 1.0e-5
batch_size: 1
grad_checkpoint: true
# The manifest's size estimate puts the longest example at 5,612 tokens at 4 characters a token and 7,482
# at 3 (the loop's pessimistic ratio for JSON-heavy prompts). Rounded up to 8,192 so nothing is truncated:
# the target is at the end of each example, so truncation would cut the answer. mlx-lm warns if any
# example is longer; measure first with scripts/prompt_budget.py --tokenizer models/qwen3-8b-4bit.
max_seq_length: 8192
# About one epoch at batch 1: the train split has 462 examples (manifest.json, split.train).
iters: 462
steps_per_report: 10
steps_per_eval: 100
val_batches: -1
save_every: 100
adapter_path: models/adapters/rules-tf-v1
seed: 0
